<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>診断④ 直前3日間</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Klee+One:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fbfcfe; --grid:#dfe8f3; --ink:#1f3a5f; --soft:#5b6f8a; --red:#c8322c; --ok:#2d8a4e;
  --line:#c9d6e6; --field:#ffffff; --ans:#fff6e0;
  --jp:#b85c7a; --ma:#2f7bbf; --en:#d08a1e; --sc:#3a8f5b; --so:#7a5cb0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; color:var(--ink); background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  font-family:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",sans-serif; font-size:17px; line-height:1.7;
}
header{max-width:820px;margin:0 auto;padding:28px 20px 8px}
h1{font-family:"Klee One","BIZ UDPGothic",serif;font-weight:600;font-size:clamp(26px,5vw,36px);margin:0;line-height:1.3}
.lead{color:var(--soft);margin:6px 0 0;font-size:15px}
.goal{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0;font-size:14px}
.goal span{border:1px solid var(--line);background:var(--field);border-radius:4px;padding:2px 8px}
.goal b{font-size:16px}
.sets{display:flex;gap:8px;margin:16px 0 0;flex-wrap:wrap}
.sets button{font:inherit;font-size:15px;border:2px solid var(--ink);background:var(--field);color:var(--ink);padding:8px 14px;border-radius:6px;cursor:pointer}
.sets button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
main{max-width:820px;margin:0 auto;padding:8px 20px 140px}
.plan{background:var(--field);border:1px solid var(--line);border-radius:6px;padding:12px 16px;margin:14px 0 22px;font-size:15px}
.plan ol{margin:6px 0 0;padding-left:1.4em}
.plan .sum{margin:8px 0 0;font-weight:700}
section.sec{position:relative;background:var(--field);border:1px solid var(--line);border-left:10px solid var(--c);border-radius:4px 8px 8px 4px;margin:0 0 26px;padding:14px 18px 10px}
.sec h2{font-family:"Klee One","BIZ UDPGothic",serif;font-weight:600;font-size:22px;margin:0;line-height:1.4}
.sec .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 8px;color:var(--soft);font-size:14px}
.tag{background:var(--c);color:#fff;border-radius:3px;padding:1px 8px;font-size:13px}
.timer{margin-left:auto;display:flex;align-items:center;gap:6px}
.timer output{font-variant-numeric:tabular-nums;font-size:18px;color:var(--ink);min-width:4.2em;text-align:right}
.timer output.over{color:var(--red)}
.timer button,.chk button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:4px;padding:3px 10px;cursor:pointer}
.note{font-size:14px;color:var(--soft);margin:0 0 8px;white-space:pre-wrap}
.passage{font-size:16px;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:10px 14px;margin:0 0 10px;white-space:pre-wrap;line-height:1.9}
.q{border-top:1px dashed var(--line);padding:10px 0}
.q:first-of-type{border-top:0}
.qt{margin:0 0 6px;white-space:pre-wrap}
.qt b{display:inline-block;min-width:2em;color:var(--c)}
.row{display:flex;gap:10px;align-items:center}
.row input[type=text],.row textarea{flex:1;font:inherit;font-size:17px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-bottom:2px solid var(--ink);border-radius:3px;padding:6px 10px;min-width:0}
.row textarea{min-height:4.2em;resize:vertical}
.paper{font-size:13px;color:var(--soft)}
label.unsure{font-size:13px;color:var(--soft);white-space:nowrap;display:flex;align-items:center;gap:4px;cursor:pointer}
label.unsure input{accent-color:var(--red);width:18px;height:18px}
.ans{display:none;margin:8px 0 0;background:var(--ans);border-radius:4px;padding:6px 10px;align-items:center;gap:10px;flex-wrap:wrap}
.sec.open .ans{display:flex}
.ans .a{flex:1;min-width:12em}
.ans .a::before{content:"答え　";color:var(--red);font-weight:700}
.mark{display:flex;gap:6px}
.mark button{font:inherit;font-size:16px;width:44px;height:36px;border:2px solid var(--line);background:var(--field);color:var(--soft);border-radius:6px;cursor:pointer}
.mark button.on[data-v="o"]{border-color:var(--ok);background:var(--ok);color:#fff}
.mark button.on[data-v="x"]{border-color:var(--red);background:var(--red);color:#fff}
.chk{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0 0;padding-top:8px;border-top:1px solid var(--line)}
.chk button.main{font-size:15px;padding:8px 14px;border:2px solid var(--c);background:var(--c);color:#fff}
.chk .score{font-weight:700}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--c,var(--ma));outline-offset:2px}
.done{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 0;align-items:center}
.done button{font:inherit;border-radius:6px;padding:10px 16px;cursor:pointer;border:2px solid var(--red);background:var(--red);color:#fff}
.done button.ghost{background:var(--field);color:var(--soft);border-color:var(--line)}
#exportBox{width:100%;min-height:12em;margin-top:10px;font:14px/1.5 "BIZ UDPGothic",sans-serif;display:none;background:var(--field);color:var(--ink)}
.review .q{padding:8px 0}
.review .from{font-size:13px;color:var(--soft)}
.pad{position:fixed;left:0;right:0;bottom:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(31,58,95,.96);display:none;justify-content:center;gap:6px;flex-wrap:wrap;z-index:5}
.pad.on{display:flex}
.pad button{font:inherit;font-size:18px;min-width:44px;height:40px;border:0;border-radius:6px;background:#fff;color:#1f3a5f;cursor:pointer}
.saved{font-size:13px;color:var(--soft)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#16202c;--grid:#1f2c3b;--ink:#e4ecf5;--soft:#9fb2c8;--line:#34465c;--field:#1b2735;--ans:#3a3220}
}
:root[data-theme="dark"]{--paper:#16202c;--grid:#1f2c3b;--ink:#e4ecf5;--soft:#9fb2c8;--line:#34465c;--field:#1b2735;--ans:#3a3220}
@media (max-width:560px){body{font-size:16px}.timer{margin-left:0}section.sec{padding:12px 12px 8px}header,main{padding-left:16px;padding-right:16px}}
@media print{.timer,.chk,.done,.sets,.pad,.row,label.unsure{display:none!important}body{background:none}section.sec{break-inside:avoid-page}}
</style>
</head>
<body>
<header>
  <h1>学習の診断④ 直前3日間</h1>
  <p class="lead">1日3時間×3日。答えはノートに考えてから入力（漢字の書き取りはノートに書くだけ）。1つの単元が終わったら「答え合わせ」を押して、○か×をつけます。まちがえた問題はその場で答えをノートに写しましょう。</p>
  <div class="goal">目標：<span>社会 <b>40</b>点</span><span>国語 <b>25</b>点</span><span>数学 <b>25</b>点</span><span>英語 <b>25</b>点</span><span>理科 <b>25</b>点</span></div>
  <div class="sets" role="tablist" id="setTabs"></div>
</header>
<main id="main"></main>
<div class="pad" id="pad" aria-label="記号入力"></div>

const KEY="sou3-shindan4-2026-11";
let store={};
try{store=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){store={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
let current="d1";
try{current=localStorage.getItem(KEY+"-set")||"d1"}catch(e){}
const tabs=document.getElementById("setTabs"), main=document.getElementById("main");
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const norm=q=>Array.isArray(q)?{q:q[0],a:q[1]}:q;
const SUBS=["国語","数学","英語","理科","社会"];
function renderTabs(){
  tabs.innerHTML="";
  SETS.forEach(s=>{const b=document.createElement("button");b.textContent=s.tab;b.setAttribute("role","tab");b.setAttribute("aria-selected",s.id===current);
    b.onclick=()=>{current=s.id;try{localStorage.setItem(KEY+"-set",current)}catch(e){};renderTabs();render();window.scrollTo(0,0)};tabs.appendChild(b)});
}
const fmt=s=>{const a=Math.abs(s);return (s<0?"−":"")+Math.floor(a/60)+":"+String(a%60).padStart(2,"0")};
function secScore(sec){let o=0,n=0;sec.qs.forEach((q,i)=>{const m=store["m_"+sec.id+"_"+(i+1)];if(m){n++;if(m==="o")o++}});return {o,n,all:sec.qs.length}}
function daySummary(set){
  const t={};set.secs.forEach(sec=>{const s=secScore(sec);t[sec.sub]=t[sec.sub]||{o:0,n:0,all:0};t[sec.sub].o+=s.o;t[sec.sub].n+=s.n;t[sec.sub].all+=s.all});
  return SUBS.filter(k=>t[k]).map(k=>`${k} ${t[k].o}/${t[k].all}${t[k].n?`（${Math.round(t[k].o/t[k].n*100)}%）`:""}`).join("　");
}
function render(){
  const set=SETS.find(s=>s.id===current);
  const total=set.secs.reduce((a,s)=>a+s.min,0);
  let h=`<div class="plan">この日の流れ（問題 ${total}分${set.id==="d3"?"＋見直し15分":""}）<ol>${set.plan.map(p=>`<li>${esc(p)}</li>`).join("")}</ol><p class="sum" id="daySum">○の数：${daySummary(set)}</p></div>`;
  set.secs.forEach(sec=>{
    const el=(store["t_"+sec.id]||0), open=store["open_"+sec.id];
    h+=`<section class="sec${open?" open":""}" id="sec_${sec.id}" style="--c:var(${sec.c})"><h2>${esc(sec.t)}</h2>
    <div class="meta"><span class="tag">${sec.sub}</span><span>目安 ${sec.min}分・${sec.qs.length}問</span>
    <span class="timer"><output id="o_${sec.id}">${fmt(sec.min*60-el)}</output><button data-t="${sec.id}">スタート</button></span></div>
    ${sec.passage?`<div class="passage">${esc(sec.passage)}</div>`:""}
    ${sec.note?`<p class="note">${esc(sec.note)}</p>`:""}`;
    sec.qs.forEach((q0,i)=>{
      const o=norm(q0), id=sec.id+"_"+(i+1), v=store[id]||"", u=store["u_"+id], m=store["m_"+id]||"";
      const paper=o.paper||sec.paper;
      const field=paper?`<span class="paper">ノートに書く</span><span style="flex:1"></span>`:(o.long?`<textarea id="${id}" data-k="${id}">${esc(v)}</textarea>`:`<input type="text" id="${id}" data-k="${id}" value="${esc(v)}" autocomplete="off" spellcheck="false">`);
      h+=`<div class="q"><p class="qt"><b>${i+1}</b>${esc(o.q)}</p>
      <div class="row">${field}<label class="unsure"><input type="checkbox" data-u="${id}" ${u?"checked":""}>自信なし</label></div>
      <div class="ans"><span class="a">${esc(o.a)}</span><span class="mark"><button data-m="${id}" data-v="o" class="${m==="o"?"on":""}" aria-label="正解">○</button><button data-m="${id}" data-v="x" class="${m==="x"?"on":""}" aria-label="まちがい">×</button></span></div></div>`;
    });
    const sc=secScore(sec);
    h+=`<div class="chk"><button class="main" data-open="${sec.id}">${open?"答えをかくす":"答え合わせ"}</button><span class="score" id="sc_${sec.id}">${sc.n?`○ ${sc.o} / ${sc.all}`:""}</span></div></section>`;
  });
  if(set.id==="d3") h+=`<section class="sec review" style="--c:var(--red)"><h2>×と自信なしの総ざらい（3日分）</h2><p class="note">3日間で×をつけた問題と「自信なし」の問題が集まります。答えを声に出して言えるか確認し、言えなければノートに写しましょう。</p><div id="reviewList"></div><div class="chk"><button class="main" id="reviewBtn">集める</button></div></section>`;
  h+=`<div class="done"><button id="copyBtn">結果をまとめてコピー</button><button class="ghost" id="resetBtn">この日の記録を消す</button><span class="saved" id="savedMsg"></span></div>
  <textarea id="exportBox" readonly aria-label="コピー用の文章"></textarea>`;
  main.innerHTML=h;
  bind(set);
}
const timers={};
function bind(set){
  main.querySelectorAll("[data-k]").forEach(f=>f.addEventListener("input",()=>{store[f.dataset.k]=f.value;save()}));
  main.querySelectorAll("[data-u]").forEach(c=>c.addEventListener("change",()=>{store["u_"+c.dataset.u]=c.checked;save()}));
  main.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.open, el=document.getElementById("sec_"+id);
    store["open_"+id]=!store["open_"+id];save();
    el.classList.toggle("open",!!store["open_"+id]);b.textContent=store["open_"+id]?"答えをかくす":"答え合わせ";
    if(store["open_"+id]&&timers[id]){clearInterval(timers[id]);delete timers[id];const tb=el.querySelector("[data-t]");if(tb)tb.textContent="再開"}
  });
  main.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.m, v=b.dataset.v;
    store["m_"+id]=store["m_"+id]===v?"":v;save();
    b.parentNode.querySelectorAll("button").forEach(x=>x.classList.toggle("on",store["m_"+id]===x.dataset.v));
    const sid=id.split("_")[0], sec=set.secs.find(s=>s.id===sid), sc=secScore(sec);
    document.getElementById("sc_"+sid).textContent=sc.n?`○ ${sc.o} / ${sc.all}`:"";
    document.getElementById("daySum").textContent="○の数："+daySummary(set);
  });
  main.querySelectorAll("[data-t]").forEach(b=>{
    const id=b.dataset.t, sec=set.secs.find(s=>s.id===id);
    if(timers[id]) b.textContent="一時停止";
    b.onclick=()=>{
      if(timers[id]){clearInterval(timers[id]);delete timers[id];b.textContent="再開";return}
      timers[id]=setInterval(()=>{store["t_"+id]=(store["t_"+id]||0)+1;save();const o=document.getElementById("o_"+id);if(o){const r=sec.min*60-store["t_"+id];o.textContent=fmt(r);o.classList.toggle("over",r<0)}},1000);
      b.textContent="一時停止";
    };
  });
  const rb=document.getElementById("reviewBtn"); if(rb) rb.onclick=buildReview;
  document.getElementById("copyBtn").onclick=()=>exportSet(set);
  document.getElementById("resetBtn").onclick=()=>{
    if(!confirm("この日の答え・○×・時間をすべて消します。よろしいですか？"))return;
    set.secs.forEach(sec=>{["t_","open_"].forEach(p=>delete store[p+sec.id]);sec.qs.forEach((q,i)=>{const id=sec.id+"_"+(i+1);["","u_","m_"].forEach(p=>delete store[p+id])})});
    save();render();
  };
}
function buildReview(){
  let h="",n=0;
  SETS.forEach(set=>set.secs.forEach(sec=>sec.qs.forEach((q0,i)=>{
    const id=sec.id+"_"+(i+1), m=store["m_"+id], u=store["u_"+id];
    if(m==="x"||u){n++;const o=norm(q0);
      h+=`<div class="q"><p class="from">${esc(set.tab.split("　")[0])}・${sec.sub}「${esc(sec.t)}」${m==="x"?"×":""}${u?" 自信なし":""}</p><p class="qt">${esc(o.q)}</p><p class="qt" style="color:var(--red)">答え　${esc(o.a)}</p></div>`}
  })));
  document.getElementById("reviewList").innerHTML=n?h:`<p class="note">×も自信なしもありません。よくがんばりました。</p>`;
}
function exportSet(set){
  let t=`【診断④対策 ${set.tab}】\n○の数：${daySummary(set)}\n`;
  set.secs.forEach(sec=>{
    const used=store["t_"+sec.id]||0, sc=secScore(sec);
    t+=`\n■${sec.sub}｜${sec.t}（${Math.floor(used/60)}分${used%60}秒／目安${sec.min}分・○${sc.o}/${sc.all}）\n`;
    sec.qs.forEach((q0,i)=>{const o=norm(q0),id=sec.id+"_"+(i+1),m=store["m_"+id];
      const paper=o.paper||sec.paper;
      t+=`${i+1}. ${o.q.replace(/\n/g," ")}\n　→ ${paper?"（ノート）":(store[id]||"（無回答）").replace(/\n/g," ")}${m==="o"?"　○":m==="x"?"　×":""}${store["u_"+id]?"　［自信なし］":""}\n`});
  });
  const box=document.getElementById("exportBox"), msg=document.getElementById("savedMsg");
  box.value=t;box.style.display="block";
  const ok=()=>{msg.textContent="コピーしました。LINEやチャットに貼り付けてください。"};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,()=>{box.select();msg.textContent="下の文字を全部選んでコピーしてください。"})}
  else{box.select();try{document.execCommand("copy");ok()}catch(e){msg.textContent="下の文字を全部選んでコピーしてください。"}}
}
// 記号パッド（数学・理科）
const SYMS=["√","²","³","±","−","×","÷","/","(",")","π","≦","°","⁺","⁻","→","₂"];
const pad=document.getElementById("pad");let lastField=null;
SYMS.forEach(s=>{const b=document.createElement("button");b.type="button";b.textContent=s;b.setAttribute("aria-label",s+" を入力");
  b.addEventListener("mousedown",e=>e.preventDefault());b.addEventListener("touchstart",e=>e.preventDefault(),{passive:false});
  const ins=()=>{if(!lastField)return;const f=lastField,st=f.selectionStart??f.value.length,en=f.selectionEnd??f.value.length;
    f.setRangeText(s,st,en,"end");f.dispatchEvent(new Event("input"));f.focus()};
  b.addEventListener("click",ins);b.addEventListener("touchend",e=>{e.preventDefault();ins()});pad.appendChild(b)});
const PAD_SECS=new Set();SETS.forEach(s=>s.secs.forEach(x=>{if(x.sub==="数学"||x.sub==="理科")PAD_SECS.add(x.id)}));
document.addEventListener("focusin",e=>{const f=e.target;if(f.matches&&f.matches("[data-k]")){lastField=f;pad.classList.toggle("on",PAD_SECS.has(f.dataset.k.split("_")[0]))}});
document.addEventListener("focusout",()=>setTimeout(()=>{if(!document.activeElement||!document.activeElement.matches("[data-k]"))pad.classList.remove("on")},150));
renderTabs();render();
</script>
