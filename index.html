<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>中間テスト対策 2時間セット</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Klee+One:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fbfcfe; --grid:#dfe8f3; --ink:#1f3a5f; --soft:#5b6f8a; --red:#c8322c;
  --line:#c9d6e6; --field:#ffffff;
  --jp:#b85c7a; --ma:#2f7bbf; --en:#d08a1e; --sc:#3a8f5b; --so:#7a5cb0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; color:var(--ink); background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  font-family:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",sans-serif; font-size:17px; line-height:1.7;
}
header{max-width:820px;margin:0 auto;padding:28px 20px 8px}
h1{font-family:"Klee One","BIZ UDPGothic",serif;font-weight:600;font-size:clamp(26px,5vw,36px);margin:0;line-height:1.3}
.lead{color:var(--soft);margin:6px 0 0;font-size:15px}
.sets{display:flex;gap:8px;margin:18px 0 0;flex-wrap:wrap}
.sets button{font:inherit;font-size:15px;border:2px solid var(--ink);background:var(--field);color:var(--ink);padding:8px 14px;border-radius:6px;cursor:pointer}
.sets button[aria-selected="true"]{background:var(--ink);color:#fff}
main{max-width:820px;margin:0 auto;padding:8px 20px 140px}
.plan{background:var(--field);border:1px solid var(--line);border-radius:6px;padding:12px 16px;margin:14px 0 22px;font-size:15px}
.plan ol{margin:6px 0 0;padding-left:1.4em}
section.sec{position:relative;background:var(--field);border:1px solid var(--line);border-left:10px solid var(--c);border-radius:4px 8px 8px 4px;margin:0 0 26px;padding:14px 18px 8px}
.sec h2{font-family:"Klee One","BIZ UDPGothic",serif;font-weight:600;font-size:22px;margin:0;line-height:1.4}
.sec .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 8px;color:var(--soft);font-size:14px}
.tag{background:var(--c);color:#fff;border-radius:3px;padding:1px 8px;font-size:13px}
.timer{margin-left:auto;display:flex;align-items:center;gap:6px}
.timer output{font-variant-numeric:tabular-nums;font-size:18px;color:var(--ink);min-width:4.2em;text-align:right}
.timer output.over{color:var(--red)}
.timer button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:4px;padding:3px 10px;cursor:pointer}
.note{font-size:14px;color:var(--soft);margin:0 0 8px}
.q{border-top:1px dashed var(--line);padding:10px 0}
.q:first-of-type{border-top:0}
.qt{margin:0 0 6px}
.qt b{display:inline-block;min-width:2em;color:var(--c)}
.row{display:flex;gap:10px;align-items:center}
.row input[type=search],.row textarea{-webkit-appearance:none;appearance:none;flex:1;font:inherit;font-size:17px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-bottom:2px solid var(--ink);border-radius:3px;padding:6px 10px;min-width:0}
.row textarea{min-height:5.2em;resize:vertical}
input[type=search]::-webkit-search-cancel-button,input[type=search]::-webkit-search-decoration{-webkit-appearance:none;display:none}
label.unsure{font-size:13px;color:var(--soft);white-space:nowrap;display:flex;align-items:center;gap:4px;cursor:pointer}
label.unsure input{accent-color:var(--red);width:18px;height:18px}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--c,var(--ma));outline-offset:2px}
.done{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 0}
.done button{font:inherit;border-radius:6px;padding:10px 16px;cursor:pointer;border:2px solid var(--red);background:var(--red);color:#fff}
.done button.ghost{background:var(--field);color:var(--soft);border-color:var(--line)}
#exportBox{width:100%;min-height:12em;margin-top:10px;font:14px/1.5 "BIZ UDPGothic",sans-serif;display:none}
.pad{position:fixed;left:0;right:0;bottom:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(31,58,95,.96);display:none;justify-content:center;gap:6px;flex-wrap:wrap;z-index:5}
.pad.on{display:flex}
.pad button{font:inherit;font-size:18px;min-width:44px;height:40px;border:0;border-radius:6px;background:#fff;color:var(--ink);cursor:pointer}
.saved{font-size:13px;color:var(--soft)}

.howto{margin:8px 0 0;font-size:14px;color:var(--soft)}
.score{font-weight:700;color:var(--ink)}
.secfoot{display:flex;justify-content:flex-end;padding:8px 0 6px}
.secfoot button{font:inherit;font-size:14px;border:2px solid var(--c);background:var(--field);color:var(--ink);border-radius:6px;padding:6px 14px;cursor:pointer}
.res{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px;font-size:15px}
.res .badge{font-weight:700;min-width:3.2em;text-align:center;border-radius:4px;padding:1px 6px;color:#fff}
.res.ok .badge{background:#2e8b57}.res.ng .badge{background:var(--red)}.res.chk .badge{background:#b8860b}
.res .key{flex:1;min-width:12em}
.res.ng .key{color:var(--red)}
.ov button{font:inherit;font-size:14px;width:34px;height:30px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:4px;cursor:pointer;margin-left:4px}
.redo{margin-top:6px}.redo input{border-bottom-color:var(--red)!important}.redo-r{font-size:14px;min-width:6em;color:var(--soft)}
.anabox{background:var(--field);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-top:16px;overflow-x:auto}
.anabox h3,.anabox h4{margin:0 0 8px;font-family:"Klee One","BIZ UDPGothic",serif;font-weight:600}
.anabox h4{margin-top:14px}
.anabox table{border-collapse:collapse;width:100%;font-size:15px}
.anabox th,.anabox td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
.bar{display:inline-block;width:70px;height:8px;border-radius:4px;margin-right:8px;vertical-align:middle;background:linear-gradient(90deg,var(--ma) var(--p),var(--grid) var(--p))}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#16202c;--grid:#1f2c3b;--ink:#e4ecf5;--soft:#9fb2c8;--line:#34465c;--field:#1b2735}
}
:root[data-theme="dark"]{--paper:#16202c;--grid:#1f2c3b;--ink:#e4ecf5;--soft:#9fb2c8;--line:#34465c;--field:#1b2735}
@media (max-width:560px){body{font-size:16px}.timer{margin-left:0}section.sec{padding:12px 12px 6px}}
</style>
</head>
<body>
<header>
  <h1>中間テスト対策 2時間セット</h1>
  <p class="lead">答えは自動で保存されます。単元が終わったら採点し、×の問題はその場でやり直せます。最後に「分析データをコピー」を押して、チャットに貼り付けてください。</p>
  <div class="sets" role="tablist" id="setTabs"></div>
</header>
<main id="main"></main>
<div class="pad" id="pad" aria-label="記号入力"></div>

<script>

  secs:[
  {id:"jp1",sub:"国語",c:"--jp",t:"漢字の書き取り",min:15,note:"カタカナの部分を漢字（送りがながあれば送りがなも）で書く。",qs:[
   "ユウソウな音楽が流れる。","海にモグる。","駅までのキョリを測る。","オウベイの文化にふれる。","犬をクサリでつなぐ。",
   "カンサンとした商店街。","チクサンが盛んな地域。","ツヤのある果物。","高いヘイに囲まれる。","お使いのダチンをもらう。",

  {id:"jp2",sub:"国語",c:"--jp",t:"類義語・対義語・語の種類",min:10,note:"類義語は「＝」、対義語は「↔」。漢字二字で答える。",qs:[

  {id:"jp3",sub:"国語",c:"--jp",t:"読解・記述（故郷／作られた「物語」を超えて／俳句）",min:15,note:"教科書の内容を思い出して答える。記述は字数を守る。",qs:[

  {id:"en2",sub:"英語",c:"--en",t:"時制の書きかえ・語の選択",min:10,note:"（　）の指示に従って全文を書く。選択問題は正しい語だけ書く。",qs:[

  {id:"en5",sub:"英語",c:"--en",t:"読解",min:10,note:"次の英文を読んで答える。\n\nMika has lived in Takamatsu for ten years. She loves the sea near her house. Last summer, she found a lot of plastic bottles on the beach. She was surprised because many sea animals may eat plastic and die. Since then, she has been cleaning the beach with her friends every Sunday. She says, \"It is important for us to think about the sea. I want everyone to join us.\" Her teacher helped her make a poster about the problem.",qs:[

  {id:"sc1",sub:"理科",c:"--sc",t:"イオン式・電離の式",min:12,note:"H⁺ や Cu²⁺ は下のボタンで入力できます（H+ や Cu2+ と打ってもOK）。",qs:[

// --- 正規化と判定 ---
function base(x){return String(x||"").normalize("NFKC").replace(/[−–—‐]/g,"-").toLowerCase().replace(/\s+/g,"")}
function nText(x){return base(x).replace(/[。．「」『』・、,，]/g,"")}
function nMath(x){return base(x).replace(/^[a-z]=/,"").replace(/(cm2|cm|個|pa|n)$/,"").replace(/[，、]/g,",")}
function nChem(x){return base(x).replace(/->|=>|＝|=/g,"→").replace(/e⁻/g,"e-")}
function nEng(x){return base(x).replace(/[.,?!'’"]/g,"")}
function nOrd(x){return base(x).replace(/[>＞,、→・]/g,"")}
function norm1(x){return nText(x).replace(/[()（）]/g,"")}
function keyOf(sec,i){const k=(KEYS[sec]||[])[i];return k===undefined?null:k}
function judge(k,ans){
  if(k==null)return null;
  if(!String(ans||"").trim())return 0;
  if(typeof k==="string"||Array.isArray(k)){const v=[].concat(k),a=norm1(ans);return v.some(x=>a.includes(norm1(x)))?1:0}
  if(k.w)return null;
  if(k.m){const a=nMath(ans);return k.m.some(x=>nMath(x)===a||nMath(x).replace(/[()]/g,"")===a.replace(/[()]/g,""))?1:0}
  if(k.c){const a=nChem(ans);return k.c.some(x=>nChem(x)===a)?1:0}
  if(k.e){const a=nEng(ans);return k.e.some(x=>nEng(x)===a)?1:0}
  if(k.o){const a=nOrd(ans);return k.o.some(x=>nOrd(x)===a)?1:0}
  if(k.s){const a=norm1(ans).replace(/,/g,"、");return k.s.every(p=>[].concat(p).some(x=>a.includes(norm1(x))))?1:0}
  return null;
}
function showKey(k){
  if(k==null)return "";
  if(typeof k==="string")return k;
  if(Array.isArray(k))return k[0];
  if(k.w)return k.w; if(k.m)return k.m[0]; if(k.c)return k.c[0]; if(k.e)return k.e[0]; if(k.o)return k.o[0];
  if(k.s)return k.s.map(p=>[].concat(p)[0]).join("、");
  return "";
}
// 最終判定：手動の○×があればそれを優先
function result(id,sec,i){
  if(store["m_"+id]!==undefined)return store["m_"+id];
  if(!store["g_"+sec])return undefined;
  return judge(keyOf(sec,i),store[id]);
}

function renderTabs(){

    b.onclick=()=>{current=s.id;renderTabs();render();window.scrollTo(0,0)};tabs.appendChild(b)});
  const w=document.createElement("button");w.textContent=onlyWrong?"すべての問題を表示":"間違い直し（×と自信なしだけ表示）";
  w.onclick=()=>{onlyWrong=!onlyWrong;renderTabs();render();window.scrollTo(0,0)};tabs.appendChild(w);
}

function secScore(sec){
  let ok=0,ng=0,pend=0;
  sec.qs.forEach((q,i)=>{const id=sec.id+"_"+(i+1),r=result(id,sec.id,i);if(r===1)ok++;else if(r===0)ng++;else pend++});
  return {ok,ng,pend,n:sec.qs.length};
}

  set.secs.forEach(sec=>{
    const el=(store["t_"+sec.id]||0), graded=!!store["g_"+sec.id], sc=secScore(sec);

      const o=qOf(q), id=sec.id+"_"+(i+1), v=store[id]||"", u=store["u_"+id], k=keyOf(sec.id,i), r=result(id,sec.id,i);

      const nf=`name="f${Math.random().toString(36).slice(2)}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-form-type="other" aria-label="${i+1}の答え"`;

      }
      body+=`<div class="q"><p class="qt"><b>${i+1}</b>${esc(o.q).replace(/\n/g,"<br>")}</p>
      <div class="row">${field}<label class="unsure"><input type="checkbox" data-u="${id}" ${u?"checked":""}>自信なし</label></div>${mark}</div>`;

    <div class="meta"><span class="tag">${sec.sub}</span><span>目安 ${sec.min}分</span>

    <div class="secfoot"><button class="grade" data-g="${sec.id}">${graded?"採点をやり直す":"この単元を採点"}</button></div></section>`;
  });

  });
  main.querySelectorAll("[data-u]").forEach(c=>c.addEventListener("change",()=>{store["u_"+c.dataset.u]=c.checked;save()}));
  main.querySelectorAll("[data-ov]").forEach(b=>b.onclick=()=>{store["m_"+b.dataset.ov]=+b.dataset.v;save();keepScroll(render)});
  main.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{const id=b.dataset.g;
    if(store["g_"+id]&&!confirm("自分で付けた○×を消して、採点をやり直しますか？"))return;
    const sec=set.secs.find(s=>s.id===id);sec.qs.forEach((q,i)=>delete store["m_"+id+"_"+(i+1)]);
    store["g_"+id]=Date.now();save();keepScroll(render)});
  main.querySelectorAll("[data-t]").forEach(b=>{
    const id=b.dataset.t, sec=set.secs.find(s=>s.id===id);
    if(timers[id])b.textContent="一時停止";
    b.onclick=()=>{
      if(timers[id]){clearInterval(timers[id]);delete timers[id];b.textContent="再開";return}
      timers[id]=setInterval(()=>{store["t_"+id]=(store["t_"+id]||0)+1;save();const o=document.getElementById("o_"+id);if(o){const r=sec.min*60-store["t_"+id];o.textContent=fmt(r);o.classList.toggle("over",r<0)}},1000);
      b.textContent="一時停止";
    };
  });
  document.getElementById("gradeAll").onclick=()=>{set.secs.forEach(sec=>{if(!store["g_"+sec.id])store["g_"+sec.id]=Date.now()});save();render();showAna(set)};
  document.getElementById("anaBtn").onclick=()=>showAna(set);
  document.getElementById("copyBtn").onclick=()=>exportSet(set);
  document.getElementById("resetBtn").onclick=()=>{
    if(!confirm("このセットの答え・採点・時間をすべて消します。よろしいですか？"))return;
    Object.keys(store).forEach(k=>delete store[k]);save();render();
  };
}
function keepScroll(fn){const y=window.scrollY;fn();window.scrollTo(0,y)}

function analyze(set){
  const subj={},rows=[],wrong=[];
  set.secs.forEach(sec=>{
    const sc=secScore(sec),t=store["t_"+sec.id]||0;let uns=0,confWrong=0,blank=0;
    sec.qs.forEach((q,i)=>{const id=sec.id+"_"+(i+1),r=result(id,sec.id,i),u=!!store["u_"+id],a=(store[id]||"").trim();
      if(u)uns++; if(!a)blank++; if(r===0&&!u&&a)confWrong++;
      if(r===0||u||r===null)wrong.push({sub:sec.sub,sec:sec.t,no:i+1,q:qOf(q).q.replace(/\n/g," "),a:a||"（無回答）",k:showKey(keyOf(sec.id,i)),r,u,re:store["re_"+id]});
    });
    const graded=!!store["g_"+sec.id];
    rows.push({sub:sec.sub,t:sec.t,min:sec.min,time:t,graded,...sc,uns,confWrong,blank});
    const S=subj[sec.sub]||(subj[sec.sub]={ok:0,n:0,time:0,uns:0,confWrong:0,pend:0,graded:0});
    S.ok+=sc.ok;S.n+=sc.n;S.time+=t;S.uns+=uns;S.confWrong+=confWrong;S.pend+=graded?sc.pend:0;S.graded+=graded?1:0;
  });
  return {subj,rows,wrong};
}
const pct=(a,b)=>b?Math.round(a*100/b):0;
function showAna(set){
  const A=analyze(set),box=document.getElementById("ana");
  let h=`<div class="anabox"><h3>分析</h3><table><thead><tr><th>教科</th><th>正答率</th><th>正解</th><th>時間</th><th>自信なし</th><th>思い込みミス</th></tr></thead><tbody>`;
  Object.entries(A.subj).forEach(([k,S])=>{h+=`<tr><td>${k}</td><td><span class="bar" style="--p:${pct(S.ok,S.n)}%"></span>${pct(S.ok,S.n)}%</td><td>${S.ok}/${S.n}</td><td>${Math.round(S.time/60)}分</td><td>${S.uns}</td><td>${S.confWrong}</td></tr>`});
  h+=`</tbody></table><p class="note">「思い込みミス」は、答えを書いて自信なしにもチェックしていないのに間違えた問題の数です。覚え違いの可能性が高いので優先して復習します。</p>
  <h4>単元別（正答率の低い順）</h4><table><thead><tr><th>単元</th><th>正答率</th><th>時間／目安</th></tr></thead><tbody>`;
  [...A.rows].filter(r=>r.graded).sort((a,b)=>pct(a.ok,a.n)-pct(b.ok,b.n)).forEach(r=>{h+=`<tr><td>${r.sub}｜${esc(r.t)}</td><td>${pct(r.ok,r.n)}%</td><td>${Math.round(r.time/60)}分／${r.min}分</td></tr>`});
  h+=`</tbody></table>${A.rows.some(r=>!r.graded)?`<p class="note">まだ採点していない単元があります。</p>`:""}</div>`;
  box.innerHTML=h;box.scrollIntoView({behavior:"smooth",block:"start"});
}

function exportSet(set){
  const A=analyze(set);const d=new Date();
  let t=`【分析データ】${set.tab}（出力 ${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,"0")}）\n\n■教科別\n`;
  Object.entries(A.subj).forEach(([k,S])=>{t+=`${k}：正答率${pct(S.ok,S.n)}%（${S.ok}/${S.n}）時間${Math.round(S.time/60)}分 自信なし${S.uns} 思い込みミス${S.confWrong}${S.pend?` 要確認${S.pend}`:""}${S.graded?"":"（未採点）"}\n`});
  t+=`\n■単元別\n`;
  A.rows.forEach(r=>{t+=`${r.sub}｜${r.t}：${r.graded?`${r.ok}/${r.n}（${pct(r.ok,r.n)}%）`:"未採点"} 時間${Math.floor(r.time/60)}分${r.time%60}秒／目安${r.min}分 自信なし${r.uns} 無回答${r.blank}\n`});
  t+=`\n■間違い・自信なし・要確認の問題\n`;
  A.wrong.forEach(w=>{const lab=w.r===0?"×":w.r===1?"○":"要確認";
    t+=`[${w.sub}｜${w.sec} ${w.no}] ${lab}${w.u?"・自信なし":""}\n　問題：${w.q}\n　解答：${w.a.replace(/\n/g," ")}\n　正答：${w.k}${w.re!==undefined?`\n　やり直し：${w.re}`:""}\n`});
  const box=document.getElementById("exportBox"), msg=document.getElementById("savedMsg");
  box.value=t;box.style.display="block";
  const ok=()=>{msg.textContent="コピーしました。チャットに貼り付けてください。"};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,()=>{box.select();msg.textContent="下の文字を全部選んでコピーしてください。"})}
  else{box.select();try{document.execCommand("copy");ok()}catch(e){msg.textContent="下の文字を全部選んでコピーしてください。"}}
}

// 記号パッド
const SYMS=["√","²","³","±","−","×","÷","/","(",")","⁺","⁻","²⁺","₂","₃","₄","→","e⁻"];
const pad=document.getElementById("pad");let lastField=null;
SYMS.forEach(s=>{const b=document.createElement("button");b.type="button";b.textContent=s;b.setAttribute("aria-label",s+" を入力");
  b.addEventListener("mousedown",e=>e.preventDefault());b.addEventListener("touchstart",e=>e.preventDefault(),{passive:false});
  const ins=()=>{if(!lastField)return;const f=lastField,st=f.selectionStart??f.value.length,en=f.selectionEnd??f.value.length;
    f.setRangeText(s,st,en,"end");f.dispatchEvent(new Event("input"));f.focus()};
  b.addEventListener("click",ins);b.addEventListener("touchend",e=>{e.preventDefault();ins()});pad.appendChild(b)});
document.addEventListener("focusin",e=>{const f=e.target;if(f.matches&&f.matches("[data-k],[data-re]")){const sec=(f.dataset.k||f.dataset.re).slice(0,2);lastField=f;pad.classList.toggle("on",["ma","sc"].includes(sec))}});
document.addEventListener("focusout",()=>setTimeout(()=>{if(!document.activeElement||!document.activeElement.matches("[data-k],[data-re]"))pad.classList.remove("on")},150));

renderTabs();render();
</script>
